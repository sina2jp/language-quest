var dbg=/[?&]debug=1\b/.test(location.search);
function el(){var b=document.getElementById('lq-diag');if(b)return b;b=document.createElement('div');b.id='lq-diag';b.setAttribute('role','status');
if(M==='preview'){b.style.cssText='position:fixed;left:8px;bottom:8px;z-index:99999;font:12px/1.4 system-ui,sans-serif;max-width:min(560px,92vw)';}

(document.body||document.documentElement).appendChild(b);return b;}
var open=false;function render(){try{if(M==='dist'&&!dbg)return;if(!D.length)return;var b=el();
if(M==='preview'){b.innerHTML='';var t=document.createElement('button');t.type='button';t.textContent='\u26a0 '+D.length;t.setAttribute('aria-label',D.length+' problems recorded; click for details');
t.style.cssText='background:#3a1208;color:#ffe3d6;border:1px solid #ff9f7a;border-radius:999px;padding:3px 10px;cursor:pointer;font:inherit;opacity:.85';t.onclick=function(){open=!open;render();};b.appendChild(t);
if(open){var l=document.createElement('div');l.style.cssText='margin-top:6px;background:#3a1208;color:#ffe3d6;border:1px solid #ff9f7a;border-radius:10px;padding:8px 10px;max-height:40vh;overflow:auto;font:12px/1.4 monospace;white-space:pre-wrap';l.textContent=D.map(function(d){return '\u26a0 '+d.m;}).join('\n');b.appendChild(l);}}
else{b.textContent=D.map(function(d){return '\u26a0 '+d.m;}).join('\n');}}catch(e){}}
function add(m){try{m=String(m).slice(0,300);D.push({t:Date.now(),m:m});if(D.length>100)D.shift();if(window.console&&console.warn)console.warn('[LangQuest] '+m);render();}catch(e){}}
window.__lqDiagAdd=add;
window.addEventListener('error',function(e){var t=e.target;if(t&&t!==window&&(t.src||t.href)){add('Failed to load '+String(t.src||t.href).split('/').pop().split('?')[0]);return;}
add((e.message||'error')+(e.filename?' @ '+String(e.filename).split('/').pop()+':'+e.lineno:''));},true);
window.addEventListener('unhandledrejection',function(e){var r=e.reason;add('Unhandled: '+(r&&(r.message||r)));});

if(/^https?:$/.test(location.protocol)){var k=document.createElement('link');k.rel='manifest';k.href='manifest.webmanifest';document.head.appendChild(k);}
})();</script>
